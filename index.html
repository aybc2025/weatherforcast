<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>מזג אוויר</title>
  <meta name="theme-color" content="#F4F7FB">
  <meta name="description" content="תחזית מזג אוויר מהירה לכל עיר">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preload" href="./fonts/heebo-hebrew-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles/fonts.css">
  <link rel="stylesheet" href="./styles/tokens.css">
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/components.css">
</head>
<body>
  <div class="app">
    <main>
      <section id="view-home" class="view">
        <div class="search">
          <div class="search__field">
            <svg class="ico ico--s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="cityInput" type="search" placeholder="חיפוש עיר" aria-label="חיפוש עיר" autocomplete="off" enterkeyhint="search">
          </div>
          <button id="locBtn" class="icon-btn" type="button" aria-label="המיקום שלי">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          </button>
          <div id="suggestions" class="suggestions" role="listbox" aria-label="תוצאות חיפוש" hidden></div>
        </div>
        <div id="recent" class="chips" aria-label="חיפושים אחרונים" hidden></div>
        <div id="banner"></div>
        <div id="home"></div>
      </section>

      <section id="view-favs" class="view" hidden>
        <h1 class="page-title">מועדפים <button id="favEdit" class="btn btn--quiet" type="button" hidden>עריכה</button></h1>
        <ul id="favList" class="stack"></ul>
      </section>

      <section id="view-settings" class="view" hidden>
        <h1 class="page-title">הגדרות</h1>
        <div class="set"><span class="set__label">מראה</span>
          <div class="seg" data-key="theme" role="group" aria-label="מראה">
            <button type="button" data-v="auto">אוטומטי</button><button type="button" data-v="light">בהיר</button><button type="button" data-v="dark">כהה</button></div></div>
        <div class="set"><span class="set__label">טמפרטורה</span>
          <div class="seg" data-key="unit" role="group" aria-label="יחידת טמפרטורה">
            <button type="button" data-v="C" dir="ltr">°C</button><button type="button" data-v="F" dir="ltr">°F</button></div></div>
        <div class="set"><span class="set__label">מהירות רוח</span>
          <div class="seg" data-key="wind" role="group" aria-label="יחידת מהירות רוח">
            <button type="button" data-v="kmh">קמ״ש</button><button type="button" data-v="mph" dir="ltr">mph</button></div></div>
        <div class="set"><span class="set__label">גרפים בתחזית שעתית</span>
          <div class="seg" data-key="charts" role="group" aria-label="גרפים">
            <button type="button" data-v="on">הצג</button><button type="button" data-v="off">הסתר</button></div></div>
        <div id="installRow" class="set" hidden><button id="installBtn" class="btn" type="button">התקנה למסך הבית</button></div>
        <p class="meta muted">נתונים מ-Open-Meteo</p>
      </section>
    </main>

    <nav class="tabbar" aria-label="ניווט ראשי">
      <button type="button" data-view="home"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>בית</button>
      <button type="button" data-view="favs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg>מועדפים</button>
      <button type="button" data-view="settings"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>הגדרות</button>
    </nav>
    <dialog id="sheet" class="sheet" aria-label="תחזית שעתית"></dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
